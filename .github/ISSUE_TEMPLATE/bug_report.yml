name: 🐞 Bug
description: Quelque chose ne marche pas
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Que se passe-t-il ?
      description: Ce que tu as fait, ce que tu attendais, ce qui est arrivé.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sortie de `kali-glass doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Fin du journal
      description: "`tail -n 40 ~/.cache/kali-glass/kali-glass.log`"
      render: text
  - type: input
    id: env
    attributes:
      label: Version de Kali et machine
      placeholder: "Kali 2026.3, VirtualBox 7, accélération 3D activée"
    validations:
      required: true
  - type: textarea
    id: shot
    attributes:
      label: Capture d'écran
