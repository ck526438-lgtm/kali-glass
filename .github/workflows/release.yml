name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les scripts
        run: |
          python3 -m py_compile bin/kali-glass apps/glass-center/glass-center tools/generate_wallpapers.py
          bash -n install.sh uninstall.sh packaging/build-deb.sh
          python3 bin/kali-glass --help > /dev/null
          python3 bin/kali-glass list

      - name: Construire le paquet .deb
        run: bash packaging/build-deb.sh

      - name: Pack des fonds d'écran
        run: cd wallpapers && zip -9 ../dist/kali-glass-wallpapers.zip *.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: kali-glass
          path: dist/*

      - name: Lire la version
        id: ver
        run: echo "version=$(grep -m1 '^VERSION' bin/kali-glass | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Vérifier si la release existe déjà
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Publie automatiquement la release quand VERSION change dans bin/kali-glass (push sur main),
      # ou quand un tag v* est poussé.
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && steps.exists.outputs.found == 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Kali Glass ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Kali Glass ${{ steps.ver.outputs.version }}

            Bureau verre (glassmorphism) façon macOS pour Kali Linux (XFCE).

            ### Installation
            ```bash
            sudo apt install ./kali-glass_${{ steps.ver.outputs.version }}_all.deb
            kali-glass apply
            ```
            Puis ouvre **Glass Center** depuis le menu. Tout annuler : `kali-glass restore`.

            ### Fichiers
            - `kali-glass_${{ steps.ver.outputs.version }}_all.deb` : paquet (CLI `kali-glass` + appli Glass Center + fonds + configs)
            - `kali-glass-wallpapers.zip` : les 6 fonds d'écran 4K seuls
