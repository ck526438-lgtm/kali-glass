name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les scripts
        run: |
          python3 -m py_compile bin/kali-glass apps/glass-center/glass-center tools/generate_wallpapers.py
          bash -n install.sh uninstall.sh packaging/build-deb.sh
          python3 bin/kali-glass --help > /dev/null
          python3 bin/kali-glass list

      - name: Construire le paquet .deb
        run: bash packaging/build-deb.sh

      - name: Pack des fonds d'écran
        run: cd wallpapers && zip -9 ../dist/kali-glass-wallpapers.zip *.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: kali-glass
          path: dist/*

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
