name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: |
          pip install pytest ruff
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint
        run: |
          ruff check .
          shellcheck install.sh uninstall.sh packaging/build-deb.sh
          shellcheck -s bash completions/kali-glass.bash
      - name: Tests
        run: pytest -q

  build:
    name: Paquet .deb
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire le .deb
        run: bash packaging/build-deb.sh

      - name: Vérifier le paquet
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb | grep -q usr/bin/kali-glass
          dpkg-deb -c dist/*.deb | grep -q usr/share/man/man1/kali-glass.1.gz

      - name: Pack des fonds d'écran
        run: |
          cd wallpapers && zip -9 ../dist/kali-glass-wallpapers.zip *.jpg
          cd ../dist && sha256sum ./*.deb ./*.zip > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: kali-glass
          path: dist/*

      - name: Lire la version
        id: ver
        run: echo "version=$(grep -m1 '^VERSION' bin/kali-glass | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Extraire les notes du CHANGELOG
        run: |
          awk -v v="${{ steps.ver.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Installation
          ```bash
          wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.ver.outputs.version }}/kali-glass_${{ steps.ver.outputs.version }}_all.deb
          sudo apt install ./kali-glass_${{ steps.ver.outputs.version }}_all.deb
          kali-glass apply
          ```
          Vérifier l'intégrité : `sha256sum -c SHA256SUMS --ignore-missing`
          EOF

      - name: La release existe-t-elle ?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Publie automatiquement quand VERSION change dans bin/kali-glass (push sur main), ou sur un tag v*.
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && steps.exists.outputs.found == 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Kali Glass ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: dist/*
          make_latest: true
