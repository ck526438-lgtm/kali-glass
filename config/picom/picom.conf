# ─────────────────────────────────────────────
#  Kali Glass — compositeur picom (flou « verre »)
#  Nécessite picom >= 10 (backend glx, dual_kawase)
# ─────────────────────────────────────────────

backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;

# ── Coins arrondis façon macOS ──
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Plank'",
  "class_g = 'Xfce4-panel'"
];

# ── Ombres douces ──
shadow = true;
shadow-radius = 28;
shadow-opacity = 0.35;
shadow-offset-x = -24;
shadow-offset-y = -14;
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'Plank'",
  "_GTK_FRAME_EXTENTS@:c",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

# ── Fondus ──
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

# ── Transparence ──
inactive-opacity = 0.96;
active-opacity = 1.0;
frame-opacity = 0.88;
inactive-opacity-override = false;
opacity-rule = [
  "90:class_g = 'Xfce4-terminal'",
  "92:class_g = 'qterminal'",
  "92:class_g = 'Thunar'",
  "95:class_g = 'Mousepad'",
  "88:class_g = 'Xfce4-panel'",
  "100:class_g = 'firefox-esr'",
  "100:class_g = 'Burpsuite'"
];

# ── FLOU DU VERRE (la partie importante) ──
blur: {
  method = "dual_kawase";
  strength = 7;
  background = true;
  background-frame = false;
  background-fixed = false;
};
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'firefox-esr' && argb"
];

wintypes: {
  tooltip = { fade = true; shadow = false; opacity = 0.92; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.92; };
  dropdown_menu = { opacity = 0.92; };
};

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
log-level = "warn";
